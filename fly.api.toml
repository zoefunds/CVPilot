# Fly.io manifest for the CVPilot API.
# Deploy with: fly deploy -c fly.api.toml
# Buildpacks: no Dockerfile required; Fly auto-detects Python.

app = "cvpilot-api"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  builder = "paketobuildpacks/builder-jammy-base"
  buildpacks = ["paketo-buildpacks/python"]

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LLM_BACKEND = "genlayer"
  PORT = "8080"
  PYTHONPATH = "/workspace"

[processes]
  api = "uvicorn backend.app.main:app --host 0.0.0.0 --port 8080 --workers 2 --proxy-headers --forwarded-allow-ips=*"

[deploy]
  release_command = "alembic -c backend/alembic.ini upgrade head"
  strategy = "rolling"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["api"]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"

  [[services.http_checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "get"
    path = "/readyz"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
