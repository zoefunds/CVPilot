# Fly.io manifest for the CVPilot Celery worker.
# Deploy with: fly deploy -c fly.worker.toml

app = "cvpilot-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  builder = "paketobuildpacks/builder-jammy-base"
  buildpacks = ["paketo-buildpacks/python"]

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LLM_BACKEND = "genlayer"
  PYTHONPATH = "/workspace"
  C_FORCE_ROOT = "1"

[processes]
  worker = "celery -A workers.celery_app.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50"

[deploy]
  strategy = "rolling"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
